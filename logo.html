<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebecca Bean Consulting Logo</title>

<style>
/* ==============================
   REBECCA BEAN CONSULTING LOGO
   ============================== */

.consulting-logo {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
}

/* 5D-inspired accent */
.logo-accent {
  position: relative;
  width: 42px;
  height: 42px;
  display: inline-block;
  flex-shrink: 0;
}

/* Five connected points */
.logo-accent span {
  position: absolute;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #FD8100;
}

/* Top */
.logo-accent span:nth-child(1) {
  top: 0;
  left: 17px;
}

/* Upper right */
.logo-accent span:nth-child(2) {
  top: 12px;
  right: 0;
  background: #69A5DF;
}

/* Lower right */
.logo-accent span:nth-child(3) {
  bottom: 2px;
  right: 7px;
  background:#2878C7;
}

/* Lower left */
.logo-accent span:nth-child(4) {
  bottom: 2px;
  left: 7px;
  background: linear-gradient(135deg,  #FD8100, #2878C7);
}

/* Upper left */
.logo-accent span:nth-child(5) {
  top: 12px;
  left: 0;
  background: #004AAD;
}

/* Brand text */
.consulting-logo-text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  line-height: 1;
}

.consulting-logo-name {
  color: #004AAD;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.consulting-logo-title {
  margin-top: 6px;
  color: #FD8100;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.22em;
}

/* Hover */
.consulting-logo:hover {
  text-decoration: none;
}

.consulting-logo:hover .logo-accent {
  transform: translateY(-1px);
  transition: transform 0.2s ease;
}
</style>

</head>
<body>

<!-- REBECCA BEAN CONSULTING LOGO -->
<a href="index.html"
   class="consulting-logo"
   aria-label="Rebecca Bean Consulting">

  <span class="logo-accent" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </span>

  <span class="consulting-logo-text">
    <span class="consulting-logo-name">Rebecca Bean</span>
    <span class="consulting-logo-title">CONSULTING</span>
  </span>

</a>

</body>
</html>
