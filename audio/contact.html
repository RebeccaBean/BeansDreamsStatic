<!-- CONTACT HERO -->
<section class="sub-hero contact-hero">
    <h1>Contact</h1>
    <p>Ready to start your edit? Get in touch and I’ll respond as soon as possible.</p>
</section>

<!-- CONTACT CONTENT -->
<section class="page-section contact-section">
    <div class="container">

        <h2 class="section-title neon-blue">Send a Message</h2>

        <form class="contact-form">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Your Message" rows="6" required></textarea>
            <button type="submit" class="btn-primary neon-button">Send Message</button>
        </form>

        <div class="contact-details">
            <h2 class="section-title neon-blue">Other Ways to Reach Me</h2>
            <p>Email: <strong>your-email@example.com</strong></p>
            <p>Location: <strong>San Diego, CA</strong></p>
        </div>

    </div>
</section>
